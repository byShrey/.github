# Redraws the page once a day (00:05 India time) so "today", the arcade game and the numbers stay current.
name: daily refresh
on:
  schedule:
    - cron: '35 18 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency: refresh
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: npm ci
      - run: node src/arcade.mjs && node src/suite.mjs .
        env:
          GH_READ_TOKEN: ${{ secrets.GH_READ_TOKEN }}
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add out
          git diff --cached --quiet || { git commit -m 'Daily refresh' && git push; }
